<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#080a12">

<title>Abdullah Anas Chowdhury</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  min-height: 100dvh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 15px;

  font-family:
    Inter,
    Arial,
    Helvetica,
    sans-serif;

  color: white;

  background:
    radial-gradient(
      circle at 10% 15%,
      rgba(0,255,190,.15),
      transparent 30%
    ),

    radial-gradient(
      circle at 90% 80%,
      rgba(35,90,255,.20),
      transparent 35%
    ),

    #080a12;
}


/* =====================================================
   CARD
===================================================== */

.card {

  --main: #00e8b1;
  --second: #2778ff;

  position: relative;

  width: min(100%, 620px);
  height: min(94dvh, 790px);

  padding: 38px;

  overflow: hidden;

  border-radius: 42px;

  border:
    1px solid rgba(255,255,255,.15);

  background:
    linear-gradient(
      145deg,
      rgba(10,35,37,.96),
      rgba(8,15,29,.96) 50%,
      rgba(17,31,72,.96)
    );

  box-shadow:
    0 35px 100px rgba(0,0,0,.60),
    inset 0 1px 0 rgba(255,255,255,.08);

  transition:
    background 1s ease,
    border-color 1s ease,
    box-shadow 1s ease;
}


/* =====================================================
   BACKGROUND GLOW
===================================================== */

.card::before {

  content: "";

  position: absolute;

  width: 450px;
  height: 450px;

  right: -200px;
  top: -200px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      var(--second),
      transparent 68%
    );

  opacity: .25;

  filter: blur(20px);

  pointer-events: none;

  transition: background 1s ease;
}


/* =====================================================
   VERTICAL LIGHT BLITZ
===================================================== */

.card::after {

  content: "";

  position: absolute;

  left: -20%;
  top: -45%;

  width: 140%;
  height: 38%;

  background:
    linear-gradient(
      to bottom,
      transparent 0%,
      rgba(255,255,255,.02) 18%,
      rgba(255,255,255,.18) 42%,
      rgba(255,255,255,.35) 50%,
      rgba(255,255,255,.08) 60%,
      transparent 100%
    );

  filter: blur(12px);

  pointer-events: none;

  z-index: 10;

  animation:
    verticalBlitz 4.5s ease-in-out infinite;
}


/* =====================================================
   SHARP BLITZ LINE
===================================================== */

.blitz-line {

  position: absolute;

  left: 0;
  top: -5%;

  width: 100%;
  height: 2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--main),
      white,
      var(--second),
      transparent
    );

  box-shadow:
    0 0 10px var(--main),
    0 0 25px var(--second),
    0 0 45px var(--main);

  z-index: 20;

  pointer-events: none;

  animation:
    blitzLine 4.5s ease-in-out infinite;
}


/* =====================================================
   TOP
===================================================== */

.top {

  position: relative;
  z-index: 30;

  display: flex;
  justify-content: center;

  margin-bottom: 28px;
}

.available {

  display: flex;
  align-items: center;

  gap: 10px;

  font-size: 12px;
  font-weight: 700;

  letter-spacing: 4px;

  text-transform: uppercase;

  color: rgba(255,255,255,.72);
}

.dot {

  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: #20ffb5;

  box-shadow:
    0 0 10px #20ffb5,
    0 0 20px #20ffb5;

  animation:
    blink 1.4s infinite;
}


/* =====================================================
   PROFILE
===================================================== */

.profile {

  position: relative;
  z-index: 30;

  display: flex;
  align-items: center;

  gap: 23px;
}


/* =====================================================
   PROFILE IMAGE
   NO ROTATION
===================================================== */

.avatar-ring {

  flex-shrink: 0;

  width: 145px;
  height: 145px;

  padding: 6px;

  border-radius: 50%;

  background:
    conic-gradient(
      from 0deg,
      var(--main),
      #1680ff,
      #00d9ff,
      #ff36a5,
      var(--main)
    );

  box-shadow:
    0 0 25px rgba(0,220,255,.35);

  transition:
    background 1s ease,
    box-shadow 1s ease;
}

.avatar {

  width: 100%;
  height: 100%;

  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: #111827;

  border:
    4px solid #101522;
}

.avatar img {

  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;
}

.avatar-text {

  display: none;

  font-size: 38px;
  font-weight: 800;
}


/* =====================================================
   NAME
===================================================== */

.name {

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(30px, 6vw, 48px);

  line-height: .98;

  letter-spacing: -2px;

  background:
    linear-gradient(
      100deg,
      #24efbe,
      #2baaff,
      #758dff
    );

  -webkit-background-clip: text;
  background-clip: text;

  color: transparent;

  animation:
    textGlow 4s ease-in-out infinite alternate;
}

.role {

  margin-top: 13px;

  font-size: 16px;
  font-weight: 600;

  color:
    rgba(255,255,255,.65);
}


/* =====================================================
   BIO
===================================================== */

.bio {

  position: relative;
  z-index: 30;

  margin-top: 28px;

  padding:
    20px
    22px
    20px
    25px;

  border-left:
    4px solid #ff2d91;

  border-radius:
    0 20px 20px 0;

  background:
    rgba(255,255,255,.055);

  color:
    rgba(255,255,255,.76);

  font-size: 18px;

  line-height: 1.65;

  box-shadow:
    inset 0 0 30px rgba(255,255,255,.015);

  transition:
    border-color 1s ease;
}


/* =====================================================
   STATS
===================================================== */

.stats {

  position: relative;
  z-index: 30;

  display: grid;

  grid-template-columns:
    repeat(3,1fr);

  margin-top: 27px;

  padding: 23px 0;

  border-top:
    1px solid rgba(255,255,255,.11);

  border-bottom:
    1px solid rgba(255,255,255,.11);

  text-align: center;
}

.stat strong {

  display: block;

  font-size: 34px;
}

.stat span {

  display: block;

  margin-top: 9px;

  font-size: 11px;
  font-weight: 700;

  letter-spacing: 2px;

  color:
    rgba(255,255,255,.50);
}


/* =====================================================
   SOCIAL LINKS
===================================================== */

.links {

  position: relative;
  z-index: 30;

  display: grid;

  gap: 12px;

  margin-top: 24px;
}

.social {

  position: relative;

  min-height: 65px;

  display: flex;
  align-items: center;

  gap: 15px;

  padding: 0 20px;

  border-radius: 20px;

  border:
    1px solid rgba(255,255,255,.13);

  background:
    rgba(255,255,255,.045);

  color: white;

  text-decoration: none;

  overflow: hidden;

  transition:
    transform .3s ease,
    background .3s ease,
    border-color .3s ease,
    box-shadow .3s ease;
}


/* Shine on hover */

.social::before {

  content: "";

  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.13),
      transparent
    );

  transform:
    translateX(-110%);

  transition:
    transform .6s ease;
}

.social:hover::before {

  transform:
    translateX(110%);
}

.social:hover {

  transform:
    translateY(-3px);

  background:
    rgba(255,255,255,.09);

  border-color:
    rgba(255,255,255,.30);

  box-shadow:
    0 12px 35px rgba(0,0,0,.25);
}

.social:active {

  transform:
    scale(.97);
}


/* =====================================================
   SOCIAL ICON BOX
===================================================== */

.icon-box {

  width: 40px;
  height: 40px;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 12px;

  transition:
    transform .3s ease,
    box-shadow .3s ease;
}


/* SVG */

.icon-box svg {

  width: 25px;
  height: 25px;

  display: block;
}


/* WhatsApp */

.whatsapp .icon-box {

  color: #25D366;

  background:
    rgba(37,211,102,.10);

  border:
    1px solid rgba(37,211,102,.20);

  box-shadow:
    0 0 15px rgba(37,211,102,.08);
}

.whatsapp:hover .icon-box {

  transform:
    scale(1.1);

  box-shadow:
    0 0 22px rgba(37,211,102,.30);
}


/* Facebook */

.facebook .icon-box {

  color: #1877F2;

  background:
    rgba(24,119,242,.10);

  border:
    1px solid rgba(24,119,242,.20);

  box-shadow:
    0 0 15px rgba(24,119,242,.08);
}

.facebook:hover .icon-box {

  transform:
    scale(1.1);

  box-shadow:
    0 0 22px rgba(24,119,242,.30);
}


/* Text */

.label {

  flex: 1;

  font-size: 17px;

  font-weight: 700;
}


/* Arrow */

.arrow {

  font-size: 28px;

  color:
    var(--second);

  transition:
    transform .3s ease;
}

.social:hover .arrow {

  transform:
    translateX(5px);
}


/* =====================================================
   THEMES
===================================================== */

.theme-2 {

  --main: #ff42a1;
  --second: #8b4dff;

  background:
    linear-gradient(
      145deg,
      #32102e,
      #180d28 50%,
      #32165a
    );
}


.theme-3 {

  --main: #ffd23f;
  --second: #ff7045;

  background:
    linear-gradient(
      145deg,
      #382908,
      #211a0b 50%,
      #3c1711
    );
}


.theme-4 {

  --main: #51d9ff;
  --second: #a653ff;

  background:
    linear-gradient(
      145deg,
      #0b2741,
      #0b1328 50%,
      #291553
    );
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes blink {

  50% {

    opacity: .35;

    transform:
      scale(.7);
  }
}


@keyframes textGlow {

  from {

    filter:
      hue-rotate(0deg);
  }

  to {

    filter:
      hue-rotate(25deg);
  }
}


/* Vertical light */

@keyframes verticalBlitz {

  0% {

    top: -45%;

    opacity: 0;
  }

  8% {

    opacity: 1;
  }

  45% {

    opacity: 1;
  }

  72% {

    top: 110%;

    opacity: 0;
  }

  100% {

    top: 110%;

    opacity: 0;
  }
}


/* Sharp line */

@keyframes blitzLine {

  0% {

    top: -5%;

    opacity: 0;
  }

  8% {

    opacity: 1;
  }

  12% {

    opacity: 1;
  }

  65% {

    top: 105%;

    opacity: 1;
  }

  72% {

    top: 105%;

    opacity: 0;
  }

  100% {

    top: 105%;

    opacity: 0;
  }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 560px) {

  body {
    padding: 10px;
  }

  .card {

    width: 100%;

    height:
      calc(100dvh - 20px);

    min-height: 0;

    padding:
      23px 18px;

    border-radius: 30px;
  }


  .top {
    margin-bottom: 20px;
  }


  .available {

    font-size: 10px;

    letter-spacing: 3px;
  }


  .profile {

    gap: 15px;
  }


  .avatar-ring {

    width: 105px;
    height: 105px;
  }


  .name {

    font-size:
      clamp(27px, 8vw, 39px);
  }


  .role {

    margin-top: 8px;

    font-size: 12px;
  }


  .bio {

    margin-top: 20px;

    padding:
      15px
      15px
      15px
      18px;

    font-size: 14px;

    line-height: 1.55;
  }


  .stats {

    margin-top: 19px;

    padding: 17px 0;
  }


  .stat strong {

    font-size: 24px;
  }


  .stat span {

    margin-top: 6px;

    font-size: 8px;

    letter-spacing: 1px;
  }


  .links {

    margin-top: 17px;

    gap: 9px;
  }


  .social {

    min-height: 57px;

    border-radius: 17px;

    padding:
      0 14px;
  }


  .icon-box {

    width: 36px;
    height: 36px;

    border-radius: 10px;
  }


  .icon-box svg {

    width: 22px;
    height: 22px;
  }


  .label {

    font-size: 15px;
  }


  .arrow {

    font-size: 24px;
  }

}

</style>

</head>


<body>

===================================================== -->

<script>

/* =====================================================
   AUTOMATIC THEME CHANGE
===================================================== */

const card =
  document.getElementById("card");


const themes = [

  "",

  "theme-2",

  "theme-3",

  "theme-4"

];


let currentTheme = 0;


/*
  প্রতি 4 সেকেন্ডে
  card-এর color/design পরিবর্তন হবে
*/

setInterval(() => {


  /* পুরোনো theme remove */

  themes.forEach(theme => {

    if (theme) {

      card.classList.remove(theme);

    }

  });


  /* পরের theme */

  currentTheme++;


  if (currentTheme >= themes.length) {

    currentTheme = 0;

  }


  /* নতুন theme */

  if (themes[currentTheme]) {

    card.classList.add(
      themes[currentTheme]
    );

  }


}, 4000);

</script>
